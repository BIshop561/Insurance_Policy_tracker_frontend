<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sign in · InsureHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="nav">
      <a class="logo" href="index.html"><span class="logo-mark">IH</span> InsureHub</a>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a data-page href="index.html">Home</a></li>
        <li><a data-page href="browse.html">Browse policy</a></li>
        <li><a data-page href="renewal.html">Renewal tracker</a></li>
        <li><a data-page href="support.html">Support</a></li>
        <li data-auth-slot></li>
      </ul>
    </header>

    <div class="auth-split">
      <div class="auth-art">
        <h2>Welcome back</h2>
        <p class="lead">Sign in to open your profile, renewal policies, and password settings.</p>
      </div>
      <div style="padding: 40px 8vw; display: grid; place-items: center">
        <form class="form-card" id="signinForm" style="width: min(440px, 100%)" novalidate>
          <h1>Sign in</h1>
          <div class="field" style="margin-top: 16px">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" required maxlength="80" pattern="[^\s@]+@[^\s@]+\.[^\s@]+" placeholder="you@email.com" autocomplete="email" />
            <span class="field-error">Invalid data</span>
          </div>
          <div class="field" style="margin-top: 12px">
            <label for="password">Password</label>
            <input id="password" name="password" type="password" required minlength="6" autocomplete="current-password" />
            <span class="field-error">Invalid data</span>
          </div>
          <button class="btn btn-primary" type="submit" style="margin-top: 18px; width: 100%">Sign in</button>
          <p class="meta" style="margin-top: 14px">New here? <a href="register.html">Create an account</a></p>
          <div id="authNote" class="notice"></div>
        </form>
      </div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
  </body>
</html>
