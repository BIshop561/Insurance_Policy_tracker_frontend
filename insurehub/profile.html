<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile · InsureHub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="page-bg"></div>
    <header class="nav">
      <a class="logo" href="index.html"><span class="logo-mark">IH</span> InsureHub</a>
      <button class="menu-btn" id="menuBtn" aria-label="Open menu">☰</button>
      <ul class="nav-links" id="navLinks">
        <li><a data-page href="index.html">Home</a></li>
        <li><a data-page href="browse.html">Browse policy</a></li>
        <li><a data-page href="renewal.html">Renewal tracker</a></li>
        <li><a data-page href="support.html">Support</a></li>
        <li data-auth-slot></li>
      </ul>
    </header>

    <section class="page-hero wrap">
      <span class="eyebrow">Account</span>
      <h1 id="welcome">Logged in</h1>
    </section>

    <section>
      <div class="wrap profile-grid">
        <nav class="side-nav glass">
          <button class="active" data-panel="panelProfile">Profile</button>
          <button data-panel="panelRenewals">Renewal policies</button>
          <button data-panel="panelPassword">Password change</button>
          <button id="signOut">Sign out</button>
        </nav>
        <div>
          <article class="panel glass active" id="panelProfile">
            <h2>Profile</h2>
            <div id="profileDetails" style="margin-top: 12px"></div>
          </article>
          <article class="panel glass" id="panelRenewals">
            <h2>Renewal policies</h2>
            <div class="renewal-list" id="renewalPolicies" style="margin-top: 12px"></div>
            <a class="btn btn-ghost" href="renewal.html" style="margin-top: 16px">Add reminder</a>
          </article>
          <article class="panel glass" id="panelPassword">
            <h2>Password change</h2>
            <form id="passwordForm" style="max-width: 420px; margin-top: 12px">
              <div class="field">
                <label for="newPassword">New password</label>
                <input id="newPassword" type="password" required minlength="6" />
              </div>
              <button class="btn btn-primary" type="submit" style="margin-top: 14px">Update password</button>
              <div id="passNote" class="notice"></div>
            </form>
          </article>
        </div>
      </div>
    </section>

    <footer class="footer"><span>© 2026 InsureHub</span></footer>
    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/renewal.js"></script>
    <script src="js/profile.js"></script>
  </body>
</html>
